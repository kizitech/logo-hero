<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Hero Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="top-bar">
    <h1 class="logo">Logo</h1>
    <nav class="nav-links-cont">
      <a class="nav-link" href="">Home</a>
      <a class="nav-link" href="">Classes</a>
      <a class="nav-link" href="">Memberships</a>
      <a class="nav-link" href="">Trainers</a>
    </nav>
    <button type="button" class="contact-btn">Contact Us</button>
    <span class="material-symbols-outlined menu-icon">
      menu
    </span>
  </header>
  <main>
    <section class="hero">
      <div class="hero-text">
        <h1 class="text-big">Join Our Community and get fit today</h1>
        <p class="text-small">Get started with our fitness journey and achieve your health goals!</p>
        <div class="hero-btns">
          <button type="button" class="join-btn">Join Classes</button>
          <button type="button" class="learn-more-btn">Learn More</button>
        </div>
      </div>
      <img class="hero-image"
        src="https://hips.hearstapps.com/hmg-prod/images/gym-workout-66d087d56ef90.jpg?crop=1.00xw:1.00xh;0,0&resize=1400:*"
        alt="Fitness Image">
    </section>
  </main>
  <footer></footer>
</body>

</html>
